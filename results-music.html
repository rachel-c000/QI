<!DOCTYPE html>
<html>
<head><title>Your Songs</title>
<link rel="stylesheet" href="style.css"></head>
<body>

  <h1>Songs for your mood</h1>

  <div id="carousel">
    <button onclick="prev()">←</button>
    <div id="song-display">
      <p id="song-title"></p>
      <p id="song-artist"></p>
    </div>
    <button onclick="next()">→</button>
  </div>

  <a href="reflect.html">Next →</a>

  <script>
    const keys = ['anger','sadness','happiness','peace','love','fear','disgust','confusion'];
    const scores = {};
    keys.forEach(k => scores[k] = parseInt(sessionStorage.getItem(k)) || 0);
    const dominant = keys.reduce((a, b) => scores[a] > scores[b] ? a : b);

    const songs = {
      anger:     [
        { title: 'Break Stuff',       artist: 'Limp Bizkit' },
        { title: 'Given Up',          artist: 'Linkin Park' },
        { title: 'Killing in the Name', artist: 'Rage Against the Machine' }
      ],
      sadness:   [
        { title: 'The Night Will Always Win', artist: 'Manchester Orchestra' },
        { title: 'Skinny Love',        artist: 'Bon Iver' },
        { title: 'Motion Picture Soundtrack', artist: 'Radiohead' }
      ],
      happiness: [
        { title: 'Good as Hell',       artist: 'Lizzo' },
        { title: 'Happy',              artist: 'Pharrell Williams' },
        { title: 'Can't Stop the Feeling', artist: 'Justin Timberlake' }
      ],
      peace:     [
        { title: 'Holocene',           artist: 'Bon Iver' },
        { title: 'River',              artist: 'Leon Bridges' },
        { title: 'Sunday Morning',     artist: 'Maroon 5' }
      ],
      love:      [
        { title: 'All of Me',          artist: 'John Legend' },
        { title: 'Make You Feel My Love', artist: 'Adele' },
        { title: 'Lover',              artist: 'Taylor Swift' }
      ],
      fear:      [
        { title: 'Breathe (2 AM)',     artist: 'Anna Nalick' },
        { title: 'In the Air Tonight', artist: 'Phil Collins' },
        { title: 'Afraid',             artist: 'The Neighbourhood' }
      ],
      disgust:   [
        { title: 'Creep',              artist: 'Radiohead' },
        { title: 'Everybody Hurts',    artist: 'R.E.M.' },
        { title: 'Fake Plastic Trees', artist: 'Radiohead' }
      ],
      confusion: [
        { title: 'Head Full of Doubt', artist: 'The Avett Brothers' },
        { title: 'Where Is My Mind',   artist: 'Pixies' },
        { title: 'Lost',               artist: 'Frank Ocean' }
      ]
    };

    const list = songs[dominant];
    let current = 0;

    function show() {
      document.getElementById('song-title').textContent  = list[current].title;
      document.getElementById('song-artist').textContent = list[current].artist;
    }

    function next() {
      current = (current + 1) % list.length;
      show();
    }

    function prev() {
      current = (current - 1 + list.length) % list.length;
      show();
    }

    show();
  </script>

</body>
</html>
