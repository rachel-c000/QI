<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Qi — Music</title>
  <link rel="stylesheet" href="results-pages.css">
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: #bff7ea;
      font-family: 'Courier Prime', monospace;
      color: #3d3228;
    }

    .page-body {
      padding: 48px 80px 120px 80px;
      max-width: 1100px;
    }

    /* HEADER */
    .playlist-title {
      font-family: 'Fraunces', serif;
      font-size: 44px;
      font-weight: 700;
      line-height: 1.1;
      margin: 0 0 10px 0;
    }

    .playlist-emotions {
      font-size: 13px;
      opacity: 0.55;
      letter-spacing: 0.04em;
      margin-bottom: 0;
    }

    .header-rule {
      width: 100%;
      max-width: 860px;
      height: 1px;
      background: rgba(61,50,40,0.2);
      margin: 18px 0 32px 0;
    }

    /* SONG GRID */
    .song-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      max-width: 860px;
    }

    .song-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px 12px 0;
      border-bottom: 1px solid rgba(61,50,40,0.1);
      transition: background 0.15s;
    }

    .song-row:hover { background: rgba(255,255,255,0.2); }

    /* album art */
    .song-thumb {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 2px;
      background: rgba(61,50,40,0.1);
      overflow: hidden;
      position: relative;
    }

    .song-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .song-thumb img.loaded { opacity: 1; }

    /* shimmer while loading */
    .song-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.3) 50%,
        rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    .song-thumb.art-loaded::after { display: none; }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .song-info { flex: 1; min-width: 0; }

    .song-name {
      font-family: 'Fraunces', serif;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-meta {
      font-size: 11px;
      opacity: 0.5;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-play {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(61,50,40,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }

    .song-play:hover { background: rgba(61,50,40,0.1); }

    .play-icon {
      width: 0; height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #3d3228;
      margin-left: 2px;
    }

    /* SPOTIFY CORNER */
    .spotify-corner {
      position: fixed;
      bottom: 40px;
      right: 60px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .spotify-label {
      font-size: 12px;
      opacity: 0.6;
      text-align: right;
      line-height: 1.5;
    }

    .spotify-label strong { display: block; font-weight: normal; opacity: 1; }

    #qr-code canvas, #qr-code img {
      display: block;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <a class="logo-link" href="index.html">
    <span class="logo-text">氣<span>(qi)</span></span>
  </a>

  <nav>
    <a href="results-mindscape.html"><h4>mindscape</h4></a>

  <br><br><br>
  <div class="page-body">
    <div class="playlist-title">Your Playlist</div>
    <div class="playlist-emotions" id="emotion-subtitle"></div>
    <div class="header-rule"></div>
    <div class="song-grid" id="song-grid"></div>
  </div>

  <div class="spotify-corner">
    <div class="spotify-label">
      <strong>add playlist</strong>on Spotify
    </div>
    <div id="qr-code"></div>
  </div>

  <script>

    /* =========================
       SONG DATABASE
    ========================= */

    var songsByCombo = {
      "happy-love-peace": [
        { title: "Good as Hell",                  artist: "Lizzo" },
        { title: "Lover",                         artist: "Taylor Swift" },
        { title: "Here Comes the Sun",            artist: "The Beatles" },
        { title: "Strawberry Swing",              artist: "Coldplay" },
        { title: "Happy",                         artist: "Pharrell Williams" },
        { title: "All of Me",                     artist: "John Legend" },
        { title: "Three Little Birds",            artist: "Bob Marley" },
        { title: "I'm Yours",                     artist: "Jason Mraz" }
      ],
      "fear-sad-confused": [
        { title: "Skinny Love",                   artist: "Bon Iver" },
        { title: "Where Is My Mind",              artist: "Pixies" },
        { title: "Lost",                          artist: "Frank Ocean" },
        { title: "The Night Will Always Win",     artist: "Manchester Orchestra" },
        { title: "Breathe (2 AM)",                artist: "Anna Nalick" },
        { title: "Fade Into You",                 artist: "Mazzy Star" },
        { title: "Lua",                           artist: "Bright Eyes" },
        { title: "Silhouette",                    artist: "Aquilo" }
      ],
      "angry-disgust-fear": [
        { title: "Break Stuff",                   artist: "Limp Bizkit" },
        { title: "Killing in the Name",           artist: "Rage Against the Machine" },
        { title: "In the Air Tonight",            artist: "Phil Collins" },
        { title: "Afraid",                        artist: "The Neighbourhood" },
        { title: "Given Up",                      artist: "Linkin Park" },
        { title: "Creep",                         artist: "Radiohead" },
        { title: "Psycho Killer",                 artist: "Talking Heads" },
        { title: "Bodies",                        artist: "Drowning Pool" }
      ],
      "disgust-fear-sad": [
        { title: "Creep",                         artist: "Radiohead" },
        { title: "Everybody Hurts",               artist: "R.E.M." },
        { title: "Fake Plastic Trees",            artist: "Radiohead" },
        { title: "Motion Picture Soundtrack",     artist: "Radiohead" },
        { title: "In the Air Tonight",            artist: "Phil Collins" },
        { title: "Skinny Love",                   artist: "Bon Iver" },
        { title: "Hurt",                          artist: "Nine Inch Nails" },
        { title: "Black",                         artist: "Pearl Jam" }
      ],
      "angry-happy-love": [
        { title: "Shut Up and Dance",             artist: "WALK THE MOON" },
        { title: "Mr. Brightside",                artist: "The Killers" },
        { title: "Take on Me",                    artist: "a-ha" },
        { title: "I Will Survive",                artist: "Gloria Gaynor" },
        { title: "Since U Been Gone",             artist: "Kelly Clarkson" },
        { title: "Good 4 U",                      artist: "Olivia Rodrigo" },
        { title: "Telephone",                     artist: "Lady Gaga" },
        { title: "Can't Stop the Feeling",        artist: "Justin Timberlake" }
      ],
      "peace-love-sad": [
        { title: "The Night We Met",              artist: "Lord Huron" },
        { title: "Holocene",                      artist: "Bon Iver" },
        { title: "Fade Into You",                 artist: "Mazzy Star" },
        { title: "Make You Feel My Love",         artist: "Adele" },
        { title: "Re: Stacks",                    artist: "Bon Iver" },
        { title: "The Promise",                   artist: "Tracy Chapman" },
        { title: "Cosmic Love",                   artist: "Florence and the Machine" },
        { title: "From Eden",                     artist: "Hozier" }
      ],
      "confused-happy-peace": [
        { title: "Dog Days Are Over",             artist: "Florence and the Machine" },
        { title: "Electric Feel",                 artist: "MGMT" },
        { title: "1901",                          artist: "Phoenix" },
        { title: "Little Talks",                  artist: "Of Monsters and Men" },
        { title: "Float On",                      artist: "Modest Mouse" },
        { title: "Ho Hey",                        artist: "The Lumineers" },
        { title: "Midnight City",                 artist: "M83" },
        { title: "Home",                          artist: "Edward Sharpe and the Magnetic Zeros" }
      ],
      "love-peace-sad": [
        { title: "Holocene",                      artist: "Bon Iver" },
        { title: "Cosmic Love",                   artist: "Florence and the Machine" },
        { title: "From Eden",                     artist: "Hozier" },
        { title: "The Night We Met",              artist: "Lord Huron" },
        { title: "Skinny Love",                   artist: "Bon Iver" },
        { title: "First Day of My Life",          artist: "Bright Eyes" },
        { title: "Big Jet Plane",                 artist: "Angus and Julia Stone" },
        { title: "Lover You Should've Come Over", artist: "Jeff Buckley" }
      ],
      "angry-happy-peace": [
        { title: "Seven Nation Army",             artist: "The White Stripes" },
        { title: "Mr. Brightside",                artist: "The Killers" },
        { title: "Uprising",                      artist: "Muse" },
        { title: "Dog Days Are Over",             artist: "Florence and the Machine" },
        { title: "Float On",                      artist: "Modest Mouse" },
        { title: "We Are Young",                  artist: "fun." },
        { title: "I Will Wait",                   artist: "Mumford and Sons" },
        { title: "Pompeii",                       artist: "Bastille" }
      ],
      "angry-fear-sad": [
        { title: "Motion Picture Soundtrack",     artist: "Radiohead" },
        { title: "Hurt",                          artist: "Nine Inch Nails" },
        { title: "Black",                         artist: "Pearl Jam" },
        { title: "Afraid",                        artist: "The Neighbourhood" },
        { title: "The Night Will Always Win",     artist: "Manchester Orchestra" },
        { title: "Disintegration",                artist: "The Cure" },
        { title: "Breathe (2 AM)",                artist: "Anna Nalick" },
        { title: "Adam's Song",                   artist: "Blink-182" }
      ],
      "happy-peace-sad": [
        { title: "Holocene",                      artist: "Bon Iver" },
        { title: "Here Comes the Sun",            artist: "The Beatles" },
        { title: "Float On",                      artist: "Modest Mouse" },
        { title: "Ho Hey",                        artist: "The Lumineers" },
        { title: "Lua",                           artist: "Bright Eyes" },
        { title: "Such Great Heights",            artist: "The Postal Service" },
        { title: "First Day of My Life",          artist: "Bright Eyes" },
        { title: "The District Sleeps Alone",     artist: "The Postal Service" }
      ],
      "angry-disgust-peace": [
        { title: "Seven Nation Army",             artist: "The White Stripes" },
        { title: "Killing in the Name",           artist: "Rage Against the Machine" },
        { title: "Uprising",                      artist: "Muse" },
        { title: "Fake Plastic Trees",            artist: "Radiohead" },
        { title: "Imagine",                       artist: "John Lennon" },
        { title: "Psycho Killer",                 artist: "Talking Heads" },
        { title: "We Are the Champions",          artist: "Queen" },
        { title: "Bullet With Butterfly Wings",   artist: "The Smashing Pumpkins" }
      ]
    };

    /* =========================
       LOAD SCORES & PICK SONGS
    ========================= */

    var keys = ['happy','sad','angry','peace','love','confused','fear','disgust'];
    var scores = {};
    keys.forEach(function(k) { scores[k] = parseInt(sessionStorage.getItem(k)) || 0; });

    var top3 = [...keys].sort((a,b) => scores[b] - scores[a]).slice(0,3);
    var comboKey = [...top3].sort().join('-');

    var songs = (songsByCombo[comboKey] || []).slice(0, 8);

    // fallback: blend top 3
    if (songs.length < 8) {
      var perEmotion = {
        happy:    [{ title:"Good as Hell", artist:"Lizzo" }, { title:"Happy", artist:"Pharrell Williams" }, { title:"Here Comes the Sun", artist:"The Beatles" }],
        sad:      [{ title:"Skinny Love", artist:"Bon Iver" }, { title:"Motion Picture Soundtrack", artist:"Radiohead" }, { title:"Breathe (2 AM)", artist:"Anna Nalick" }],
        angry:    [{ title:"Killing in the Name", artist:"Rage Against the Machine" }, { title:"Seven Nation Army", artist:"The White Stripes" }, { title:"Uprising", artist:"Muse" }],
        peace:    [{ title:"Imagine", artist:"John Lennon" }, { title:"Holocene", artist:"Bon Iver" }, { title:"Fade Into You", artist:"Mazzy Star" }],
        love:     [{ title:"All of Me", artist:"John Legend" }, { title:"From Eden", artist:"Hozier" }, { title:"Cosmic Love", artist:"Florence and the Machine" }],
        confused: [{ title:"Where Is My Mind", artist:"Pixies" }, { title:"Lost", artist:"Frank Ocean" }, { title:"Electric Feel", artist:"MGMT" }],
        fear:     [{ title:"In the Air Tonight", artist:"Phil Collins" }, { title:"Afraid", artist:"The Neighbourhood" }, { title:"The Night Will Always Win", artist:"Manchester Orchestra" }],
        disgust:  [{ title:"Creep", artist:"Radiohead" }, { title:"Fake Plastic Trees", artist:"Radiohead" }, { title:"Hurt", artist:"Nine Inch Nails" }]
      };
      songs = [];
      [3,3,2].forEach(function(n,i) {
        songs = songs.concat((perEmotion[top3[i]] || []).slice(0,n));
      });
    }

    /* =========================
       RENDER ROWS (no art yet)
    ========================= */

    document.getElementById("emotion-subtitle").textContent = top3.join(" + ");

    var grid = document.getElementById("song-grid");

    songs.forEach(function(s, idx) {
      var row = document.createElement("div");
      row.className = "song-row";
      row.id = "row-" + idx;

      row.innerHTML =
        '<div class="song-thumb" id="thumb-' + idx + '">' +
          '<img id="img-' + idx + '" src="" alt="" />' +
        '</div>' +
        '<div class="song-info">' +
          '<div class="song-name">' + s.title + '</div>' +
          '<div class="song-meta">' + s.artist + '</div>' +
        '</div>' +
        '<a class="song-play" href="https://open.spotify.com/search/' +
          encodeURIComponent(s.title + ' ' + s.artist) +
          '" target="_blank"><div class="play-icon"></div></a>';

      grid.appendChild(row);
    });

    /* =========================
       FETCH ALBUM ART
       MusicBrainz search → Cover Art Archive
       Rate-limited: one at a time, 300ms apart
    ========================= */

    function fetchArtForSong(s, idx) {
      return new Promise(function(resolve) {

        var mbUrl =
          'https://musicbrainz.org/ws/2/recording/?fmt=json&limit=1&query=' +
          encodeURIComponent('recording:"' + s.title + '" AND artist:"' + s.artist + '"');

        fetch(mbUrl, { headers: { 'User-Agent': 'QiInstallation/1.0' } })
          .then(function(r) { return r.json(); })
          .then(function(data) {

            var recordings = data.recordings || [];
            if (!recordings.length) { resolve(null); return; }

            var release = (recordings[0].releases || [])[0];
            if (!release) { resolve(null); return; }

            var mbid = release.id;

            // now fetch cover art
            return fetch('https://coverartarchive.org/release/' + mbid)
              .then(function(r) {
                if (!r.ok) throw new Error('no art');
                return r.json();
              })
              .then(function(art) {
                var front = (art.images || []).find(function(i) { return i.front; });
                var url = front
                  ? (front.thumbnails['250'] || front.thumbnails['500'] || front.image)
                  : null;
                resolve(url);
              });
          })
          .catch(function() { resolve(null); });
      });
    }

    function applyArt(idx, url) {
      var thumb = document.getElementById('thumb-' + idx);
      var img   = document.getElementById('img-' + idx);
      if (!thumb || !img) return;

      if (url) {
        img.onload = function() {
          img.classList.add('loaded');
          thumb.classList.add('art-loaded');
        };
        img.onerror = function() {
          thumb.classList.add('art-loaded'); // remove shimmer even on fail
        };
        img.src = url;
      } else {
        thumb.classList.add('art-loaded');
      }
    }

    // stagger requests — MusicBrainz asks for max 1/sec
    songs.forEach(function(s, idx) {
      setTimeout(function() {
        fetchArtForSong(s, idx).then(function(url) {
          applyArt(idx, url);
        });
      }, idx * 350);
    });

    /* =========================
       QR CODE
    ========================= */

    var spotifyUrl = "https://open.spotify.com/search/" +
      encodeURIComponent(top3.join(' ') + ' mood playlist');

    new QRCode(document.getElementById("qr-code"), {
      text: spotifyUrl,
      width: 100,
      height: 100,
      colorDark: "#3d3228",
      colorLight: "#bff7ea",
      correctLevel: QRCode.CorrectLevel.M
    });

  </script>
