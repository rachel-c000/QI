  <style>
    * { box-sizing: border-box; }

    .page-body {
      padding: 48px 80px 120px 80px;
      max-width: 1100px;
    }

    /* HEADER */
    .playlist-title {
      font-family: 'Fraunces', serif;
      font-size: 44px;
      font-weight: 700;
      line-height: 1.1;
      margin: 0 0 10px 0;
    }

    .playlist-emotions {
      font-size: 13px;
      opacity: 0.55;
      letter-spacing: 0.04em;
      margin-bottom: 0;
    }

    .header-rule {
      width: 100%;
      max-width: 860px;
      height: 1px;
      background: rgba(61,50,40,0.2);
      margin: 18px 0 32px 0;
    }

    /* SONG GRID */
    .song-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      max-width: 860px;
    }

    .song-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px 12px 0;
      border-bottom: 1px solid rgba(61,50,40,0.1);
      transition: background 0.15s;
    }

    .song-row:hover { background: rgba(255,255,255,0.2); }

    /* album art */
    .song-thumb {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 2px;
      background: rgba(61,50,40,0.1);
      overflow: hidden;
      position: relative;
    }

    .song-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .song-thumb img.loaded { opacity: 1; }

    /* shimmer while loading */
    .song-thumb::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.3) 50%,
        rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    .song-thumb.art-loaded::after { display: none; }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .song-info { flex: 1; min-width: 0; }

    .song-name {
      font-family: 'Fraunces', serif;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-meta {
      font-size: 11px;
      opacity: 0.5;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-play {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(61,50,40,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }

    .song-play:hover { background: rgba(61,50,40,0.1); }

    .play-icon {
      width: 0; height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #3d3228;
      margin-left: 2px;
    }

    /* SPOTIFY CORNER */
    .spotify-corner {
      position: fixed;
      bottom: 40px;
      right: 60px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .spotify-label {
      font-size: 12px;
      opacity: 0.6;
      text-align: right;
      line-height: 1.5;
    }

    .spotify-label strong { display: block; font-weight: normal; opacity: 1; }

    #qr-code canvas, #qr-code img {
      display: block;
      border-radius: 3px;
    }
  </style>

    var keys = ['happy','sad','angry','peace','love','confused','fear','disgust'];
    var scores = {};
    keys.forEach(function(k) { scores[k] = parseInt(sessionStorage.getItem(k)) || 0; });

    var top3 = [...keys].sort((a,b) => scores[b] - scores[a]).slice(0,3);
    var comboKey = [...top3].sort().join('-');

    var songs = (songsByCombo[comboKey] || []).slice(0, 8);

    // fallback: blend top 3
    if (songs.length < 8) {
      var perEmotion = {
        happy:    [{ title:"Good as Hell", artist:"Lizzo" }, { title:"Happy", artist:"Pharrell Williams" }, { title:"Here Comes the Sun", artist:"The Beatles" }],

    /* =========================

       Rate-limited: one at a time, 300ms apart
    ========================= */

    function fetchArtForSong(s, idx) {
      return new Promise(function(resolve) {

        var mbUrl =
          'https://musicbrainz.org/ws/2/recording/?fmt=json&limit=1&query=' +
          encodeURIComponent('recording:"' + s.title + '" AND artist:"' + s.artist + '"');

        fetch(mbUrl, { headers: { 'User-Agent': 'QiInstallation/1.0' } })
          .then(function(r) { return r.json(); })
          .then(function(data) {

            var recordings = data.recordings || [];
            if (!recordings.length) { resolve(null); return; }

            var release = (recordings[0].releases || [])[0];
            if (!release) { resolve(null); return; }

            var mbid = release.id;

            // now fetch cover art
            return fetch('https://coverartarchive.org/release/' + mbid)
              .then(function(r) {
                if (!r.ok) throw new Error('no art');
                return r.json();
              })
              .then(function(art) {
                var front = (art.images || []).find(function(i) { return i.front; });
                var url = front
                  ? (front.thumbnails['250'] || front.thumbnails['500'] || front.image)
                  : null;
                resolve(url);
              });
          })
          .catch(function() { resolve(null); });
      });
    }

    function applyArt(idx, url) {

      var img   = document.getElementById('img-' + idx);

          thumb.classList.add('art-loaded');
        };
        img.onerror = function() {
          thumb.classList.add('art-loaded'); // remove shimmer even on fail
        };
        img.src = url;
      } else {
        thumb.classList.add('art-loaded');
      }
    }

    var idEl = document.getElementById('card-id');
    if (idEl) idEl.textContent = 'No.' + _qi_userId;
 
    var domEl = document.getElementById('card-dominant-value');
    if (domEl) domEl.textContent = _qi_dominant;
 
    var tilesEl = document.getElementById('card-tiles');
    if (tilesEl) {
      tilesEl.innerHTML = '';
      _qi_top3.forEach(function(e) {
        var chip = document.createElement('span');
        chip.className = 'card-tile-chip';
        chip.textContent = e;
        chip.style.borderColor = _qi_colors[e];
        tilesEl.appendChild(chip);
      });
    }
 
    var aImg  = document.getElementById('card-animal-img');
    var aName = document.getElementById('card-animal-name');
    var aDesc = document.getElementById('card-animal-desc');
    if (aImg)  aImg.src = _qi_animal.img;
    if (aName) aName.textContent = _qi_animal.name;
    if (aDesc) aDesc.textContent = _qi_animal.desc;
 
    var tracksEl = document.getElementById('card-tracks');
    if (tracksEl) {
      tracksEl.innerHTML = '';
      var showTracks = _qi_tracks.slice(0, 5);
      if (showTracks.length) {
        showTracks.forEach(function(t, i) {
          var div = document.createElement('div');
          div.className = 'card-track';
          div.textContent = (i+1) + '. ' + (t.title || t.name || t) + (t.artist ? ' — ' + t.artist : '');
          tracksEl.appendChild(div);
        });
      } else {
        var pl = document.getElementById('card-playlist-section');
        if (pl) pl.style.display = 'none';
      }
    }
 
    if (_qi_reflection) {
      var refSection = document.getElementById('card-reflection-section');
      var refText    = document.getElementById('card-reflection-text');
      if (refSection) refSection.style.display = '';
      if (refText)    refText.textContent = '"' + _qi_reflection + '"';
    }
 
    var dateEl = document.getElementById('card-date');
    if (dateEl) {
      var d = new Date();
      dateEl.textContent = d.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' });
    }
  }
 
  function buildShareUrl() {
    var base = window.location.origin + window.location.pathname
      .replace(/\/[^/]*$/, '/share-card.html');
    var params = new URLSearchParams();
    params.set('uid',      _qi_userId);
    params.set('dominant', _qi_dominant);
    params.set('top3',     _qi_top3.join(','));
    params.set('animal',   _qi_animal.name);
    params.set('adesc',    _qi_animal.desc.slice(0, 120));
    params.set('aimg',     _qi_animal.img);
    if (_qi_tracks.length) {
      var trackStr = _qi_tracks.slice(0,5).map(function(t) {
        return (t.title || t.name || t) + (t.artist ? '|' + t.artist : '');
      }).join(';;');
      params.set('tracks', trackStr);
    }
    if (_qi_reflection) params.set('ref', _qi_reflection.slice(0, 200));
    _qi_keys.forEach(function(k) { params.set(k, _qi_scores[k]); });
    return base + '?' + params.toString();
  }
 
  var _qi_qr_generated = false;
 
  function generateQR(url) {
    if (_qi_qr_generated) return;
    var canvas = document.getElementById('qi-qr-canvas');
    if (!canvas || typeof QRCode === 'undefined') return;
    try {
      new QRCode(canvas, {
        text: url, width: 140, height: 140,
        colorDark: '#3d3228', colorLight: '#faf7f0',
        correctLevel: QRCode.CorrectLevel.M
      });
      _qi_qr_generated = true;
    } catch(e) { console.warn('QR generation failed:', e); }
    var urlEl = document.getElementById('qi-share-url');
    if (urlEl) urlEl.textContent = url.length > 80 ? url.slice(0,77)+'…' : url;
  }
 
  function openQiModal() {
    populateCard();
    var url = buildShareUrl();
    generateQR(url);
    var backdrop = document.getElementById('qi-modal-backdrop');
    if (backdrop) backdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
 
  function closeQiModal() {
    var backdrop = document.getElementById('qi-modal-backdrop');
    if (backdrop) backdrop.classList.remove('open');
    document.body.style.overflow = '';
  }
 
  function handleBackdropClick(e) {
    if (e.target === document.getElementById('qi-modal-backdrop')) closeQiModal();
  }
 
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeQiModal();
  });
 
  function downloadCard() {
    var card = document.getElementById('qi-summary-card');
    if (!card || typeof html2canvas === 'undefined') {
      alert('Download not available. Try scanning the QR code instead.');
      return;
    }
    html2canvas(card, { scale: 2, useCORS: true, backgroundColor: null, logging: false })
      .then(function(canvas) {
        var link = document.createElement('a');
        link.download = 'qi-card-no' + _qi_userId + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      })
      .catch(function(err) {
        console.error('html2canvas error:', err);
        alert('Could not generate image. Try scanning the QR code instead.');
      });
  }
 
  function qiPersistAnimal(a) {
    if (!a) return;
    sessionStorage.setItem('qi_animal_name', a.name || '');
    sessionStorage.setItem('qi_animal_desc', a.desc || '');
    sessionStorage.setItem('qi_animal_img',  a.img  || '');
    _qi_animal = { name: a.name, desc: a.desc, img: a.img };
  }
 
  function qiPersistTracks(arr) {
    if (!Array.isArray(arr)) return;
    sessionStorage.setItem('qi_tracks', JSON.stringify(arr));
    _qi_tracks = arr;
  }
 
  function qiPersistReflection(text) {
    if (!text) return;
    sessionStorage.setItem('qi_reflection', text);
    _qi_reflection = text;
  }

  </script>

</body>
