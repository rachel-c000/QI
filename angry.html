<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://damianofalcioni.github.io;">
  <title>Angry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Courier+Prime&family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="emotion-pages.css">
  <style>
    body {
      background-color: #FFA697;
    }
  </style>
</head>
<body>

  <!-- logo -->
  <a class="logo-link" href="index.html">
    <span class="logo-text">氣<span>(qi)</span></span>
  </a>

  <!-- progress bar -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" style="width: 37.5%"></div>
  </div>

  <div class="page">
    <div class="layout">

      <!-- title texts -->
      <div class="title-texts">
        <div class="chinese-word"><h1>愤怒</h1></div>
        <div class="english-word"><h2>angry</h2></div>
        <div class="emotion-question"><h3>how much anger do you feel right now?</h3></div>
      </div>

      <!-- background image -->
      <div class="background-image">
        <img src="images/anger-image.png" alt="fire-tree"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      </div>

      <!-- scanner -->
      <div class="right-col">
        <div class="scan-box">
          <video id="video" autoplay playsinline muted></video>
          <div class="corner-bl"></div>
          <div class="corner-br"></div>
          <div class="scan-line" id="scan-line"></div>
        </div>
        <div class="scan-hint" id="status">[hold back of card up to camera]</div>
        <div class="or-label">or tap a number</div>
        <div class="number-row">
          <a href="#" onclick="choose(0)">0</a>
          <a href="#" onclick="choose(1)">1</a>
          <a href="#" onclick="choose(2)">2</a>
          <a href="#" onclick="choose(3)">3</a>
          <a href="#" onclick="choose(4)">4</a>
          <a href="#" onclick="choose(5)">5</a>
          <a href="#" onclick="choose(6)">6</a>
          <a href="#" onclick="choose(7)">7</a>
          <a href="#" onclick="choose(8)">8</a>
          <a href="#" onclick="choose(9)">9</a>
          <a href="#" onclick="choose(10)">10</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    var EMOTION_KEY = 'angry';
    var NEXT_PAGE = 'video.html?video=angry&next=peace.html';
  </script>
  <script src="https://damianofalcioni.github.io/js-aruco2/src/cv.js"></script>
  <script src="https://damianofalcioni.github.io/js-aruco2/src/aruco.js"></script>
  <script src="scanner.js"></script>

</body>
</html>
