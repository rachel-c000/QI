<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Qi — Reflect</title>
  <link rel="stylesheet" href="style.css">
  <script src="emotion-pages.js"></script>
  <style>
    body { display:flex; flex-direction:column; min-height:100vh; }

    .reflect-layout {
      display: flex;
      gap: 60px;
      padding: 110px 40px 40px 40px;
      flex: 1;
    }

    /* left: score bars */
    .reflect-left {
      width: 260px;
      flex-shrink: 0;
      padding-top: 60px;
    }

    /* right: textarea */
    .reflect-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .reflect-heading {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 700;
      color: #3d3228;
    }

    textarea {
      flex: 1;
      min-height: 340px;
      border: 1.5px solid #3d3228;
      border-radius: 8px;
      background: #fff;
      padding: 20px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: #3d3228;
      resize: none;
      outline: none;
      line-height: 1.7;
    }

    textarea::placeholder {
      color: rgba(61,50,40,0.3);
    }

    .submit-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }

    .submit-btn {
      background: transparent;
      border: 1.5px solid #3d3228;
      border-radius: 20px;
      padding: 10px 24px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: #3d3228;
      cursor: pointer;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      background: #3d3228;
      color: #f5f0d8;
    }

    .submit-btn.primary {
      background: #3d3228;
      color: #f5f0d8;
    }

    .submit-btn.primary:hover {
      opacity: 0.8;
    }

    #feedback {
      font-size: 13px;
      color: #3d3228;
      opacity: 0.7;
      display: none;
    }

    .done-link {
      font-size: 13px;
      color: #3d3228;
      text-decoration: underline;
      display: none;
      margin-top: 8px;
    }

nav {
      position: absolute;
      top: 30px;
      right: 30px;
      display: flex;
      gap: 2px;
      pointer-events: all;
    }
    nav a {
      font-family: 'Courier Prime', monospace;
      font-size: 13px;
      color: #2e2a24;
      text-decoration: none;
      padding: 7px 14px;
      border: 1.5px solid transparent;
      background: rgba(245,240,216,0.7);
      backdrop-filter: blur(4px);
    }
    nav a:hover { background: rgba(245,240,216,0.95); }
    nav a.active {
      background: rgba(245,240,216,0.95);
      border-color: #2e2a24;
    }

a img {
width: 80px;
position: absolute;
top: 50px;
left: 50px;
}
  </style>
</head>
<body>

<a href="index.html">
  <img src="images/logo.png" alt="logo">
</a>

 <nav>
    <a href="results-interactive.html">landscape</a>
    <a href="results-chart.html">chart</a>
    <a href="results-element.html">element</a>
    <a href="results-music.html">music</a>
    <a href="results-comment.html" class="active">reflect</a>
  </nav>

  <div class="reflect-layout">

    <div class="reflect-left">
      <div class="score-bars" id="score-bars"></div>
    </div>

    <div class="reflect-right">
      <div class="reflect-heading">share why you feel these emotions &lt;3</div>
      <textarea id="comment" placeholder="write here..."></textarea>
      <div class="submit-row">
        <span id="feedback"></span>
        <button class="submit-btn" onclick="savePrivate()">keep private</button>
        <button class="submit-btn primary" onclick="savePublic()">submit</button>
      </div>
      <a href="index.html" class="done-link" id="done-link">start again →</a>
    </div>

  </div>

  <script>
    var keys   = ['happy','sad','angry','peace','love','confused','fear','disgust'];
    var colors = {
      happy:'#FFD71E', sad:'#2264DC', angry:'#E8251A', peace:'#50D2A0',
      love:'#FF64A0', confused:'#A050DC', fear:'#3d1a6e', disgust:'#6E8C32'
    };

    var scores = {};
    keys.forEach(function(k) { scores[k] = parseInt(sessionStorage.getItem(k)) || 0; });
    var dominant = keys.reduce(function(a,b) { return scores[a] > scores[b] ? a : b; });

    // build score bars
    var barsEl = document.getElementById('score-bars');
    keys.forEach(function(k) {
      var row = document.createElement('div');
      row.className = 'score-row';
      row.innerHTML =
        '<span class="label">' + k + '</span>' +
        '<div class="bar-bg"><div class="bar-fill" style="width:' + (scores[k] * 10) + '%;background:' + colors[k] + '"></div></div>' +
        '<span class="num">' + scores[k] + '</span>';
      barsEl.appendChild(row);
    });

    function savePublic() {
      var text = document.getElementById('comment').value.trim();
      if (!text) return;

      var all = JSON.parse(localStorage.getItem('qi_public') || '[]');
      all.push({
        dominant: dominant,
        scores:   scores,
        comment:  text,
        time:     new Date().toISOString()
      });
      localStorage.setItem('qi_public', JSON.stringify(all));

      document.getElementById('feedback').textContent = 'shared publicly.';
      document.getElementById('feedback').style.display = 'inline';
      document.getElementById('done-link').style.display = 'block';
    }

    function savePrivate() {
      var text = document.getElementById('comment').value.trim();
      if (!text) return;

      var all = JSON.parse(localStorage.getItem('qi_private') || '[]');
      all.push({
        dominant: dominant,
        scores:   scores,
        comment:  text,
        time:     new Date().toISOString()
      });
      localStorage.setItem('qi_private', JSON.stringify(all));

      document.getElementById('feedback').textContent = 'kept privately.';
      document.getElementById('feedback').style.display = 'inline';
      document.getElementById('done-link').style.display = 'block';
    }
  </script>

</body>
</html>
