<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Qi — Your Element</title>
  <link rel="stylesheet" href="style.css">
  <script src="emotion-pages.js"></script>
  <style>
    body { display:flex; align-items:center; justify-content:center; height:100vh; }

    .element-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: 60px;
      text-align: center;
    }

    .element-title {
      font-size: 14px;
      color: #3d3228;
      margin-bottom: 20px;
      font-family: 'Fraunces', serif;
      font-weight: 700;
    }

    .element-card {
      width: 380px;
    }

    .element-card-top {
      height: 80px;
    }

    .element-card-img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .element-card-placeholder {
      width: 100%;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }

    .element-name {
      font-family: 'Fraunces', serif;
      font-size: 48px;
      font-weight: 700;
      color: #3d3228;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .element-desc {
      font-size: 14px;
      color: #3d3228;
      line-height: 1.6;
      max-width: 380px;
      text-align: justify;
      margin-bottom: 8px;
    }

    .element-tags {
      font-size: 13px;
      color: #3d3228;
      opacity: 0.6;
    }

    nav {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 9999;
    }

      nav a.active {
  background: #f5f0d8;
  color: #3d3228;
  border: 1.5px solid #3d3228;
}

a img {
width: 80px;
position: absolute;
top: 50px;
left: 50px;
}
  </style>
</head>
<body>

<a href="index.html">
  <img src="images/logo.png" alt="logo">
</a>

  <nav>
    <a href="results-interactive.html">landscape</a>
    <a href="results-chart.html">chart</a>
    <a href="results-element.html" class="active">element</a>
    <a href="results-music.html">music</a>
    <a href="results-comment.html">reflect</a>
  </nav>

  <div class="element-layout">
    <div class="element-title">your element</div>

    <div class="element-card">
      <div class="element-card-top" id="card-top"></div>
      <div class="element-card-placeholder" id="card-img"></div>
    </div>

    <div class="element-name" id="element-name"></div>
    <div class="element-desc" id="element-desc"></div>
    <div class="element-tags" id="element-tags"></div>
  </div>

  <script>
    var keys = ['happy','sad','angry','peace','love','confused','fear','disgust'];
    var scores = {};
    keys.forEach(function(k) { scores[k] = parseInt(sessionStorage.getItem(k)) || 0; });
    var dominant = keys.reduce(function(a,b) { return scores[a] > scores[b] ? a : b; });

    var elements = {
      happy:    { name:'Wind',  emoji:'🌬️', color:'#c8e8f5', desc:'You are light and free. Wind lifts everything around it, carrying warmth and possibility wherever it moves.', tags:'#light #free #uplifting' },
      sad:      { name:'Water', emoji:'💧', color:'#c8d8f5', desc:'You run deep. Water holds memory and moves at its own pace, shaping everything it touches without force.', tags:'#deep #fluid #feeling' },
      angry:    { name:'Fire',  emoji:'🔥', color:'#f5c8c8', desc:'You burn with intensity. Fire transforms everything it touches, and that heat is a power — not a flaw.', tags:'#intense #transforming #alive' },
      peace:    { name:'Earth', emoji:'🌿', color:'#50D2A0', desc:'You are grounded and still. Earth holds space for everything, providing the quiet foundation everything else grows from.', tags:'#calm #grounded #still' },
      love:     { name:'Light', emoji:'✨', color:'#f5c8e0', desc:'You radiate warmth outward. Light finds its way into every corner and makes the world visible to everyone around it.', tags:'#warm #open #radiant' },
      confused: { name:'Mist',  emoji:'🌫️', color:'#e0c8f5', desc:'You are shifting and searching. Mist is not lost — it is transitioning. Clarity is already forming inside you.', tags:'#searching #shifting #becoming' },
      fear:     { name:'Storm', emoji:'⚡', color:'#c8c8f5', desc:'You carry electricity. Storms are powerful and temporary, and the stillness that follows them is profound.', tags:'#electric #raw #temporary' },
      disgust:  { name:'Stone', emoji:'🪨', color:'#d8e8c8', desc:'You are solid and firm. Stone knows exactly what it will not allow, and that boundary is a form of wisdom.', tags:'#firm #solid #knowing' }
    };

    var el = elements[dominant];
    document.getElementById('card-top').style.background  = el.color;
    document.getElementById('card-img').style.background  = el.color;
    document.getElementById('card-img').textContent       = el.emoji;
    document.getElementById('element-name').textContent   = el.name;
    document.getElementById('element-desc').textContent   = el.desc;
    document.getElementById('element-tags').textContent   = el.tags;
  </script>

</body>
</html>
