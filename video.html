<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>...</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; }

    #active-video {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    .skip-btn {
      position: fixed;
      bottom: 32px;
      right: 40px;
      font-family: 'Courier Prime', monospace;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      background: none;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 20px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }
    .skip-btn:hover { color: #fff; border-color: #fff; }
  </style>
</head>
<body>

  <!-- single video element, src set dynamically -->
  <video id="active-video" autoplay muted playsinline></video>

  <button class="skip-btn" onclick="goNext()">skip →</button>

  <script>
    window.onpageshow = function(e) {
  if (e.persisted) window.location.reload();
};

  var params    = new URLSearchParams(window.location.search);
  var videoName = params.get('video') || 'happy';
  var nextPage  = params.get('next')  || 'index.html';

function goNext() {
  vid.pause();
  vid.removeEventListener('ended', goNext);
  vid.src = '';
  vid.load();
  window.location.href = nextPage;
}

  var vid = document.getElementById('active-video');
  vid.src = 'videos/' + videoName + '.mp4';
  vid.muted = true;
  vid.load();

  vid.addEventListener('canplay', function() {
    vid.play().catch(function(err) {
      console.log('play failed:', err);
    });
  });

  vid.addEventListener('ended', goNext);

  // Fallback: if video fails to load at all, skip after 3 seconds
  vid.addEventListener('error', function() {
    console.log('video error:', vid.error);
    setTimeout(goNext, 3000);
  });
</script>

</body>
</html>
