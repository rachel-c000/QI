  <script>
    var keys = ['happy','sad','angry','peace','love','confused','fear','disgust'];

    var colors = {
      happy:    '#FFD71E',
      sad:      '#2264DC',
      angry:    '#E8251A',
      peace:    '#50D2A0',
      love:     '#FF64A0',
      confused: '#A050DC',
      fear:     '#3d1a6e',
      disgust:  '#6E8C32'
    };

    var bgMap = {
      happy:    '#f5f0d8',
      sad:      '#d8e4f5',
      angry:    '#f5dbd8',
      peace:    '#c8f0e4',
      love:     '#f5d8e8',
      confused: '#ede0f5',
      fear:     '#ddd8f5',
      disgust:  '#dff0d8'
    };

    var tileImages = {
  happy: 'images/happy-mahjong.png',
  sad: 'images/sad-mahjong.png',
  angry: 'images/angry-mahjong.png',
  peace: 'images/peace-mahjong.png',
  love: 'images/love-mahjong.png',
  confused: 'images/confused-mahjong.png',
  fear: 'images/fear-mahjong.png',
  disgust: 'images/disgust-mahjong.png'
};

    /* SVG symbols for each emotion drawn on the tile face */
    function tileSVG(emotion, color) {
      var bg = '#f7f2e4';
      var border = color;
      var symbol = '';

      if (emotion === 'happy') {
        'images/happy-mahjong.png'
      } else if (emotion === 'sad') {
        symbol = '<circle cx="31" cy="36" r="14" fill="none" stroke="'+color+'" stroke-width="2.5"/>' +
          '<path d="M22 44 Q31 35 40 44" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/>' +
          '<circle cx="26" cy="32" r="2" fill="'+color+'"/><circle cx="36" cy="32" r="2" fill="'+color+'"/>' +
          '<line x1="28" y1="28" x2="26" y2="25" stroke="'+color+'" stroke-width="1.5"/>' +
          '<line x1="34" y1="28" x2="36" y2="25" stroke="'+color+'" stroke-width="1.5"/>' +
          '<text x="31" y="70" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="'+color+'" font-weight="700">悲伤</text>';
      } else if (emotion === 'angry') {
        symbol = '<polygon points="31,18 36,30 50,30 39,38 43,52 31,44 19,52 23,38 12,30 26,30" fill="none" stroke="'+color+'" stroke-width="2.2"/>' +
          '<text x="31" y="70" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="'+color+'" font-weight="700">愤怒</text>';
      } else if (emotion === 'peace') {
        symbol = '<circle cx="31" cy="36" r="13" fill="none" stroke="'+color+'" stroke-width="2.5"/>' +
          '<line x1="31" y1="23" x2="31" y2="49" stroke="'+color+'" stroke-width="2"/>' +
          '<line x1="31" y1="44" x2="20" y2="38" stroke="'+color+'" stroke-width="2"/>' +
          '<line x1="31" y1="44" x2="42" y2="38" stroke="'+color+'" stroke-width="2"/>' +
          '<text x="31" y="70" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="'+color+'" font-weight="700">平静</text>';
      } else if (emotion === 'love') {
        symbol = '<path d="M31 46 C31 46 16 37 16 27 C16 21 21 18 31 26 C41 18 46 21 46 27 C46 37 31 46 31 46Z" fill="none" stroke="'+color+'" stroke-width="2.5"/>' +
          '<text x="31" y="70" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="'+color+'" font-weight="700">爱</text>';
      } else if (emotion === 'confused') {
        symbol = '<text x="31" y="46" text-anchor="middle" font-size="28" fill="'+color+'" font-family="serif">?</text>' +
          '<text x="31" y="70" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="'+color+'" font-weight="700">困惑</text>';
      } else if (emotion === 'fear') {
        symbol = '<path d="M31 18 L44 42 L18 42 Z" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>' +
          '<line x1="31" y1="28" x2="31" y2="36" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/>' +
          '<circle cx="31" cy="40" r="1.5" fill="'+color+'"/>' +
          '<text x="31" y="70" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="'+color+'" font-weight="700">恐惧</text>';
      } else if (emotion === 'disgust') {
        symbol = '<path d="M20 30 Q25 22 31 28 Q37 22 42 30 Q46 40 31 50 Q16 40 20 30Z" fill="none" stroke="'+color+'" stroke-width="2.2"/>' +
          '<text x="31" y="70" text-anchor="middle" font-family="Noto Serif SC,serif" font-size="11" fill="'+color+'" font-weight="700">厌恶</text>';
      }

      return '<svg viewBox="0 0 62 84" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="1" y="1" width="60" height="82" rx="5" fill="'+bg+'" stroke="'+border+'" stroke-width="2.5"/>' +
        '<rect x="4" y="4" width="54" height="76" rx="3" fill="none" stroke="'+border+'" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>' +
        symbol +
        '</svg>';
    }

    /* --- read scores --- */
    var scores = {};
    keys.forEach(function(k) {
      scores[k] = parseInt(sessionStorage.getItem(k)) || 0;
    });

    /* demo fallback so page looks good if no sessionStorage */
    var hasAny = keys.some(function(k) { return scores[k] > 0; });
    if (!hasAny) {
      scores = { happy: 7, sad: 2, angry: 4, peace: 9, love: 5, confused: 4, fear: 3, disgust: 0 };
    }

    /* dominant */
    var dominant = keys.reduce(function(a, b) { return scores[a] >= scores[b] ? a : b; });
    document.getElementById('dominant-word').textContent = dominant;
    document.body.style.backgroundColor = bgMap[dominant];

    /* score bars */
    var barsEl = document.getElementById('score-bars');
    keys.forEach(function(k) {
      var row = document.createElement('div');
      row.className = 'score-row';
      row.innerHTML =
        '<span class="label">'+k+'</span>' +
        '<div class="bar-bg"><div class="bar-fill" style="width:'+(scores[k]*10)+'%;background:'+colors[k]+'"></div></div>' +
        '<span class="num">'+scores[k]+'</span>';
      barsEl.appendChild(row);
    });

    /* --- spawn tiles --- */
    var canvas = document.getElementById('canvas');
    var tiles = [];
    var zCounter = 10;

    /* safe spawn zone — avoid UI corners */
var spawnGrid = (function() {
  var placed = [];
  var TW = 62, TH = 84, padding = 16;

  return function() {
    var attempts = 0;
    var x, y, safe;

    do {
      safe = true;
      x = 80 + Math.random() * (window.innerWidth  - 240);
      y = 120 + Math.random() * (window.innerHeight - 260);

      for (var i = 0; i < placed.length; i++) {
        var dx = x - placed[i].x;
        var dy = y - placed[i].y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < TW + padding) {
          safe = false;
          break;
        }
      }
      attempts++;
    } while (!safe && attempts < 200);

    placed.push({ x: x, y: y });
    return { x: x, y: y };
  };
})();

    keys.forEach(function(k) {
      var count = scores[k];
      for (var i = 0; i < count; i++) {
        var pos = spawnGrid();
        var el = document.createElement('div');
        el.className = 'tile';
        el.innerHTML =
  '<img src="' + tileImages[k] + '" alt="' + k + '">';
        var rotation = (Math.random() - 0.5) * 90;
if (Math.abs(rotation) < 10) rotation += rotation < 0 ? -12 : 12;
        el.style.left = pos.x + 'px';
        el.style.top  = pos.y + 'px';
        el.style.transform = 'rotate('+rotation+'deg)';
        el.style.zIndex = zCounter++;

        var tileData = { el: el, x: pos.x, y: pos.y, vx: 0, vy: 0, rot: rotation, emotion: k };
        tiles.push(tileData);
        canvas.appendChild(el);
        makeDraggable(el, tileData);
      }
    });

    /* --- drag logic with simple collision push --- */
    function makeDraggable(el, data) {
      var startX, startY, startLeft, startTop, dragging = false;

      function onDown(e) {
        dragging = true;
        el.classList.add('dragging');
        el.style.zIndex = ++zCounter;
        var p = pointer(e);
        startX = p.x; startY = p.y;
        startLeft = data.x; startTop = data.y;
        e.preventDefault();
      }

      function onMove(e) {
        if (!dragging) return;
        var p = pointer(e);
        var dx = p.x - startX;
        var dy = p.y - startY;
        data.x = startLeft + dx;
        data.y = startTop  + dy;
        el.style.left = data.x + 'px';
        el.style.top  = data.y + 'px';

        /* give velocity for physics push */
        data.vx = p.x - startX - (data.lastPx || p.x - startX);
        data.vy = p.y - startY - (data.lastPy || p.y - startY);
        data.lastPx = p.x - startX;
        data.lastPy = p.y - startY;

        pushNearby(data);
      }

      function onUp() {
        if (!dragging) return;
        dragging = false;
        el.classList.remove('dragging');
        data.lastPx = null; data.lastPy = null;
      }

      el.addEventListener('mousedown',  onDown);
      el.addEventListener('touchstart', onDown, { passive: false });
      window.addEventListener('mousemove',  onMove);
      window.addEventListener('touchmove',  onMove, { passive: false });
      window.addEventListener('mouseup',   onUp);
      window.addEventListener('touchend',  onUp);
    }

    function pointer(e) {
      if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function pushNearby(source) {
      var W = 62, H = 84, PUSH = 80;
      tiles.forEach(function(t) {
        if (t === source) return;
        var dx = (t.x + W/2) - (source.x + W/2);
        var dy = (t.y + H/2) - (source.y + H/2);
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < PUSH && dist > 1) {
          var force = (PUSH - dist) / PUSH;
          t.vx += (dx / dist) * force * 8;
          t.vy += (dy / dist) * force * 8;
        }
      });
    }

    /* physics tick — drift, friction, boundary bounce */
    function tick() {
      var W = 62, H = 84;
      tiles.forEach(function(t) {
        if (Math.abs(t.vx) < 0.05 && Math.abs(t.vy) < 0.05) return;
        t.vx *= 0.88;
        t.vy *= 0.88;
        t.x += t.vx;
        t.y += t.vy;

        /* bounce off edges */
        if (t.x < 0)                          { t.x = 0;                        t.vx *= -0.4; }
        if (t.x > window.innerWidth  - W)     { t.x = window.innerWidth  - W;   t.vx *= -0.4; }
        if (t.y < 0)                          { t.y = 0;                        t.vy *= -0.4; }
        if (t.y > window.innerHeight - H)     { t.y = window.innerHeight - H;   t.vy *= -0.4; }

        t.el.style.left = t.x + 'px';
        t.el.style.top  = t.y + 'px';
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

     var _qi_colors = typeof colors !== 'undefined' ? colors : {
    happy:'#FFD71E', sad:'#2264DC', angry:'#E8251A',
    peace:'#50D2A0', love:'#FF64A0', confused:'#A050DC',
    fear:'#3d1a6e', disgust:'#6E8C32'
  };
  var _qi_bgMap = typeof bgMap !== 'undefined' ? bgMap : {
    happy:'#f5f0d8', sad:'#d8e4f5', angry:'#f5dbd8',
    peace:'#c8f0e4', love:'#f5d8e8', confused:'#ede0f5',
    fear:'#ddd8f5', disgust:'#dff0d8'
  };
  var _qi_keys = ['happy','sad','angry','peace','love','confused','fear','disgust'];
 
  var _qi_scores = {};
  _qi_keys.forEach(function(k) {
    _qi_scores[k] = parseInt(sessionStorage.getItem(k)) || 0;
  });
 
  var _qi_dominant = _qi_keys.reduce(function(a,b) {
    return _qi_scores[a] >= _qi_scores[b] ? a : b;
  });
 
  var _qi_top3 = _qi_keys.slice().sort(function(a,b) {
    return _qi_scores[b] - _qi_scores[a];
  }).slice(0,3);
 
  var _qi_userId = parseInt(sessionStorage.getItem('qi_user_id')) || 1;
 
  var _qi_animal = {
    name: sessionStorage.getItem('qi_animal_name') || '',
    desc: sessionStorage.getItem('qi_animal_desc') || '',
    img:  sessionStorage.getItem('qi_animal_img')  || ''
  };
 
  var _qi_tracks = [];
  try { _qi_tracks = JSON.parse(sessionStorage.getItem('qi_tracks') || '[]'); } catch(e) {}
 
  var _qi_reflection = sessionStorage.getItem('qi_reflection') || '';
 
  function populateCard() {
    var card = document.getElementById('qi-summary-card');
    if (!card) return;
    card.style.background = _qi_bgMap[_qi_dominant] || '#f5f0d8';
 
    var dot = document.getElementById('card-dot');
    if (dot) dot.style.background = _qi_colors[_qi_dominant];
    var idEl = document.getElementById('card-id');
    if (idEl) idEl.textContent = 'No.' + _qi_userId;
 
    var domEl = document.getElementById('card-dominant-value');
    if (domEl) domEl.textContent = _qi_dominant;
 
    var tilesEl = document.getElementById('card-tiles');
    if (tilesEl) {
      tilesEl.innerHTML = '';
      _qi_top3.forEach(function(e) {
        var chip = document.createElement('span');
        chip.className = 'card-tile-chip';
        chip.textContent = e;
        chip.style.borderColor = _qi_colors[e];
        tilesEl.appendChild(chip);
      });
    }
 
    var aImg  = document.getElementById('card-animal-img');
    var aName = document.getElementById('card-animal-name');
    var aDesc = document.getElementById('card-animal-desc');
    if (aImg)  aImg.src = _qi_animal.img;
    if (aName) aName.textContent = _qi_animal.name;
    if (aDesc) aDesc.textContent = _qi_animal.desc;
 
    var tracksEl = document.getElementById('card-tracks');
    if (tracksEl) {
      tracksEl.innerHTML = '';
      var showTracks = _qi_tracks.slice(0, 5);
      if (showTracks.length) {
        showTracks.forEach(function(t, i) {
          var div = document.createElement('div');
          div.className = 'card-track';
          div.textContent = (i+1) + '. ' + (t.title || t.name || t) + (t.artist ? ' — ' + t.artist : '');
          tracksEl.appendChild(div);
        });
      } else {
        var pl = document.getElementById('card-playlist-section');
        if (pl) pl.style.display = 'none';
      }
    }
 
    if (_qi_reflection) {
      var refSection = document.getElementById('card-reflection-section');
      var refText    = document.getElementById('card-reflection-text');
      if (refSection) refSection.style.display = '';
      if (refText)    refText.textContent = '"' + _qi_reflection + '"';
    }
 
    var dateEl = document.getElementById('card-date');
    if (dateEl) {
      var d = new Date();
      dateEl.textContent = d.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' });
    }
  }
 
  function buildShareUrl() {
    var base = window.location.origin + window.location.pathname
      .replace(/\/[^/]*$/, '/share-card.html');
    var params = new URLSearchParams();
    params.set('uid',      _qi_userId);
    params.set('dominant', _qi_dominant);
    params.set('top3',     _qi_top3.join(','));
    params.set('animal',   _qi_animal.name);
    params.set('adesc',    _qi_animal.desc.slice(0, 120));
    params.set('aimg',     _qi_animal.img);
    if (_qi_tracks.length) {
      var trackStr = _qi_tracks.slice(0,5).map(function(t) {
        return (t.title || t.name || t) + (t.artist ? '|' + t.artist : '');
      }).join(';;');
      params.set('tracks', trackStr);
    }
    if (_qi_reflection) params.set('ref', _qi_reflection.slice(0, 200));
    _qi_keys.forEach(function(k) { params.set(k, _qi_scores[k]); });
    return base + '?' + params.toString();
  }
 
  var _qi_qr_generated = false;
 
  function generateQR(url) {
    if (_qi_qr_generated) return;
    var canvas = document.getElementById('qi-qr-canvas');
    if (!canvas || typeof QRCode === 'undefined') return;
    try {
      new QRCode(canvas, {
        text: url, width: 140, height: 140,
        colorDark: '#3d3228', colorLight: '#faf7f0',
        correctLevel: QRCode.CorrectLevel.M
      });
      _qi_qr_generated = true;
    } catch(e) { console.warn('QR generation failed:', e); }
    var urlEl = document.getElementById('qi-share-url');
    if (urlEl) urlEl.textContent = url.length > 80 ? url.slice(0,77)+'…' : url;
  }
 
  function openQiModal() {
    populateCard();
    var url = buildShareUrl();
    generateQR(url);
    var backdrop = document.getElementById('qi-modal-backdrop');
    if (backdrop) backdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
 
  function closeQiModal() {
    var backdrop = document.getElementById('qi-modal-backdrop');
    if (backdrop) backdrop.classList.remove('open');
    document.body.style.overflow = '';
  }
 
  function handleBackdropClick(e) {
    if (e.target === document.getElementById('qi-modal-backdrop')) closeQiModal();
  }
 
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeQiModal();
  });
 
  function downloadCard() {
    var card = document.getElementById('qi-summary-card');
    if (!card || typeof html2canvas === 'undefined') {
      alert('Download not available. Try scanning the QR code instead.');
      return;
    }
    html2canvas(card, { scale: 2, useCORS: true, backgroundColor: null, logging: false })
      .then(function(canvas) {
        var link = document.createElement('a');
        link.download = 'qi-card-no' + _qi_userId + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      })
      .catch(function(err) {
        console.error('html2canvas error:', err);
        alert('Could not generate image. Try scanning the QR code instead.');
      });
  }
 
  function qiPersistAnimal(a) {
    if (!a) return;
    sessionStorage.setItem('qi_animal_name', a.name || '');
    sessionStorage.setItem('qi_animal_desc', a.desc || '');
    sessionStorage.setItem('qi_animal_img',  a.img  || '');
    _qi_animal = { name: a.name, desc: a.desc, img: a.img };
  }
 
  function qiPersistTracks(arr) {
    if (!Array.isArray(arr)) return;
    sessionStorage.setItem('qi_tracks', JSON.stringify(arr));
    _qi_tracks = arr;
  }
 
  function qiPersistReflection(text) {
    if (!text) return;
