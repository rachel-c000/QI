  <style>

    /* =========================
       TWO-COLUMN LAYOUT
    ========================= */

    .page-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 60px);
    }

    /* =========================
       LEFT COLUMN
    ========================= */

    .col-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 60px 60px 80px;
      gap: 24px;
    }

    .animal-label {
      font-size: 13px;
      opacity: 0.6;
      letter-spacing: 0.08em;
      text-transform: lowercase;
    }

    .animal-img {
      width: 100%;
      max-width: 360px;
      height: auto;
      object-fit: contain;
    }

    .animal-name {
      font-family: 'Fraunces', serif;
      font-size: 52px;
      font-weight: 700;
      line-height: 1;
    }

    .animal-desc {
      font-size: 14px;
      line-height: 1.7;
      max-width: 380px;
    }

    /* =========================
       RIGHT COLUMN
    ========================= */

    .col-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px 60px 60px;
      gap: 32px;
      border-left: 1px solid rgba(61,50,40,0.15);
    }

    /* emotion combo header */
    .emotion-combo {
      font-size: 13px;
      opacity: 0.55;
      letter-spacing: 0.04em;
    }

    /* mahjong tiles row */
    .tiles-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .tile-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .tile-wrap img {
      width: 72px;
      height: auto;
      object-fit: contain;
    }

    .tile-label {
      font-size: 11px;
      opacity: 0.55;
      text-align: center;
    }

    /* emotion explanation */
    .emotion-explain {
      font-size: 13px;
      line-height: 1.7;
      max-width: 380px;
    }

    /* divider */
    .divider {
      width: 40px;
      height: 1px;
      background: rgba(61,50,40,0.25);
    }

    /* zodiac years */
    .years-label {
      font-size: 11px;
      opacity: 0.5;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .years-list {
      font-size: 13px;
      line-height: 1.8;
    }

    /* tags */
    .animal-tags {
      font-size: 13px;
      opacity: 0.55;
      letter-spacing: 0.02em;
    }

  </style>
</head>

    };

    var fallback = {
      name: "dragon",
      img: "images/dragon.png",
      desc: "You are spirited and magnetic, carrying a fire that draws others in. Your presence commands attention and inspires awe.",
      emotionExplain: "The dragon holds contradictions — power and stillness, fire and calm. Whatever your emotional makeup today, you carry an energy that moves others.",

    };

    /* =========================
   LOAD + COMPUTE
========================= */

var keys = ['happy','sad','angry','peace','love','confused','fear','disgust'];
var scores = {};
keys.forEach(k => { scores[k] = parseInt(sessionStorage.getItem(k)) || 0; });

var top3 = [...keys].sort((a,b) => scores[b] - scores[a]).slice(0,3);
var comboKey = [...top3].sort().join('-');

// Try exact match first
var animal = animals[comboKey];

// If no exact match, find the animal whose key shares the most emotions with top3
if (!animal) {
  var bestMatch = null;
  var bestScore = -1;

  Object.keys(animals).forEach(function(key) {
    var keyEmotions = key.split('-');
    var overlap = top3.filter(e => keyEmotions.includes(e)).length;
    if (overlap > bestScore) {
      bestScore = overlap;
      bestMatch = key;
    }
  });

  animal = bestMatch ? animals[bestMatch] : fallback;
}

/* set background based on dominant emotion */
document.body.style.backgroundColor = bgMap[top3[0]];

    /* =========================
       RENDER LEFT COLUMN
    ========================= */

    document.getElementById("animal-img").src   = animal.img;
    document.getElementById("animal-name").textContent = animal.name;
    document.getElementById("animal-desc").textContent = animal.desc;

    /* =========================
       RENDER RIGHT COLUMN
    ========================= */

    // emotion combo header
    document.getElementById("emotion-combo").textContent = top3.join(" + ");

    // mahjong tiles
    var tilesRow = document.getElementById("tiles-row");
    top3.forEach(function(emotion) {
      var t = emotionTiles[emotion];
      if (!t) return;
      var wrap = document.createElement("div");
      wrap.className = "tile-wrap";
      wrap.innerHTML = `
        <img src="${t.img}" alt="${t.label}" />
        <div class="tile-label">${t.label}</div>
      `;
      tilesRow.appendChild(wrap);
    });

    // emotion explanation
    document.getElementById("emotion-explain").textContent = animal.emotionExplain;

    // years
    document.getElementById("years-animal-name").textContent = animal.name;
    document.getElementById("years-list").textContent = animal.years;

    // tags
    document.getElementById("animal-tags").textContent = animal.tags;
/* dominant */
var dominant = keys.reduce(function(a, b) { return scores[a] >= scores[b] ? a : b; });
document.body.style.backgroundColor = bgMap[dominant];

 var _qi_colors = typeof colors !== 'undefined' ? colors : {
    happy:'#FFD71E', sad:'#2264DC', angry:'#E8251A',
    peace:'#50D2A0', love:'#FF64A0', confused:'#A050DC',
    fear:'#3d1a6e', disgust:'#6E8C32'
  };
  var _qi_bgMap = typeof bgMap !== 'undefined' ? bgMap : {
    happy:'#f5f0d8', sad:'#d8e4f5', angry:'#f5dbd8',
    peace:'#c8f0e4', love:'#f5d8e8', confused:'#ede0f5',
    fear:'#ddd8f5', disgust:'#dff0d8'
  };
  var _qi_keys = ['happy','sad','angry','peace','love','confused','fear','disgust'];
 
  var _qi_scores = {};
  _qi_keys.forEach(function(k) {
    _qi_scores[k] = parseInt(sessionStorage.getItem(k)) || 0;
  });
 
  var _qi_dominant = _qi_keys.reduce(function(a,b) {
    return _qi_scores[a] >= _qi_scores[b] ? a : b;
  });
 
  var _qi_top3 = _qi_keys.slice().sort(function(a,b) {
    return _qi_scores[b] - _qi_scores[a];
  }).slice(0,3);
 
  var _qi_userId = parseInt(sessionStorage.getItem('qi_user_id')) || 1;
 
var _qi_animal = { name: '', desc: '', img: '' };
 
  var _qi_tracks = [];
  try { _qi_tracks = JSON.parse(sessionStorage.getItem('qi_tracks') || '[]'); } catch(e) {}
 
  var _qi_reflection = sessionStorage.getItem('qi_reflection') || '';
 
  function populateCard() {
    var card = document.getElementById('qi-summary-card');
    if (!card) return;
    card.style.background = _qi_bgMap[_qi_dominant] || '#f5f0d8';
 
    var dot = document.getElementById('card-dot');
    if (dot) dot.style.background = _qi_colors[_qi_dominant];
    var idEl = document.getElementById('card-id');
    if (idEl) idEl.textContent = 'No.' + _qi_userId;
 
    var domEl = document.getElementById('card-dominant-value');
    if (domEl) domEl.textContent = _qi_dominant;
 
    var tilesEl = document.getElementById('card-tiles');
    if (tilesEl) {
      tilesEl.innerHTML = '';
      _qi_top3.forEach(function(e) {
        var chip = document.createElement('span');
        chip.className = 'card-tile-chip';
        chip.textContent = e;
        chip.style.borderColor = _qi_colors[e];
        tilesEl.appendChild(chip);
      });
    }
 
    var aImg  = document.getElementById('card-animal-img');
    var aName = document.getElementById('card-animal-name');
    var aDesc = document.getElementById('card-animal-desc');
    if (aImg)  aImg.src = _qi_animal.img;
    if (aName) aName.textContent = _qi_animal.name;
    if (aDesc) aDesc.textContent = _qi_animal.desc;
 
    var tracksEl = document.getElementById('card-tracks');
    if (tracksEl) {
      tracksEl.innerHTML = '';
      var showTracks = _qi_tracks.slice(0, 5);
      if (showTracks.length) {
        showTracks.forEach(function(t, i) {
          var div = document.createElement('div');
          div.className = 'card-track';
          div.textContent = (i+1) + '. ' + (t.title || t.name || t) + (t.artist ? ' — ' + t.artist : '');
          tracksEl.appendChild(div);
        });
      } else {
        var pl = document.getElementById('card-playlist-section');
        if (pl) pl.style.display = 'none';
      }
    }
 
    if (_qi_reflection) {
      var refSection = document.getElementById('card-reflection-section');
      var refText    = document.getElementById('card-reflection-text');
      if (refSection) refSection.style.display = '';
      if (refText)    refText.textContent = '"' + _qi_reflection + '"';
    }
 
    var dateEl = document.getElementById('card-date');
    if (dateEl) {
      var d = new Date();
      dateEl.textContent = d.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' });
    }
  }
 
  function buildShareUrl() {
    var base = window.location.origin + window.location.pathname
      .replace(/\/[^/]*$/, '/share-card.html');
    var params = new URLSearchParams();
    params.set('uid',      _qi_userId);
    params.set('dominant', _qi_dominant);
    params.set('top3',     _qi_top3.join(','));
    params.set('animal',   _qi_animal.name);
    params.set('adesc',    _qi_animal.desc.slice(0, 120));
    params.set('aimg',     _qi_animal.img);
    if (_qi_tracks.length) {
      var trackStr = _qi_tracks.slice(0,5).map(function(t) {
        return (t.title || t.name || t) + (t.artist ? '|' + t.artist : '');
      }).join(';;');
      params.set('tracks', trackStr);
    }
    if (_qi_reflection) params.set('ref', _qi_reflection.slice(0, 200));
    _qi_keys.forEach(function(k) { params.set(k, _qi_scores[k]); });
    return base + '?' + params.toString();
  }
 
  var _qi_qr_generated = false;
 
  function generateQR(url) {
    if (_qi_qr_generated) return;
    var canvas = document.getElementById('qi-qr-canvas');
    if (!canvas || typeof QRCode === 'undefined') return;
    try {
      new QRCode(canvas, {
        text: url, width: 140, height: 140,
        colorDark: '#3d3228', colorLight: '#faf7f0',
        correctLevel: QRCode.CorrectLevel.M
      });
      _qi_qr_generated = true;
    } catch(e) { console.warn('QR generation failed:', e); }
    var urlEl = document.getElementById('qi-share-url');
    if (urlEl) urlEl.textContent = url.length > 80 ? url.slice(0,77)+'…' : url;
  }
 
  function openQiModal() {
    populateCard();
    var url = buildShareUrl();
    generateQR(url);
    var backdrop = document.getElementById('qi-modal-backdrop');
    if (backdrop) backdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
 
  function closeQiModal() {
    var backdrop = document.getElementById('qi-modal-backdrop');
    if (backdrop) backdrop.classList.remove('open');
    document.body.style.overflow = '';
  }
 
  function handleBackdropClick(e) {
    if (e.target === document.getElementById('qi-modal-backdrop')) closeQiModal();
  }
 
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeQiModal();
  });
 
  function downloadCard() {
    var card = document.getElementById('qi-summary-card');
    if (!card || typeof html2canvas === 'undefined') {
      alert('Download not available. Try scanning the QR code instead.');
      return;
    }
    html2canvas(card, { scale: 2, useCORS: true, backgroundColor: null, logging: false })
      .then(function(canvas) {
        var link = document.createElement('a');
        link.download = 'qi-card-no' + _qi_userId + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      })
      .catch(function(err) {
        console.error('html2canvas error:', err);
        alert('Could not generate image. Try scanning the QR code instead.');
      });
  }
 
function qiPersistAnimal(a) {
    if (!a) return;
    // convert to absolute URL so the card can always find it
    var absImg = a.img ? new URL(a.img, window.location.href).href : '';
    sessionStorage.setItem('qi_animal_name', a.name || '');
    sessionStorage.setItem('qi_animal_desc', a.desc || '');
    sessionStorage.setItem('qi_animal_img',  absImg);
    _qi_animal = { name: a.name, desc: a.desc, img: absImg };
  }
 
  function qiPersistTracks(arr) {
    if (!Array.isArray(arr)) return;
    sessionStorage.setItem('qi_tracks', JSON.stringify(arr));
    _qi_tracks = arr;
  }
 
  function qiPersistReflection(text) {
    if (!text) return;
    sessionStorage.setItem('qi_reflection', text);
    _qi_reflection = text;
  }

  qiPersistAnimal(animal); // call this right after animal is resolved
  </script>

</body>
</html>
