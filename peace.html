<!DOCTYPE html>
<html>
<head><title>Peace</title>
<style>
  #scan-box {
    position: relative;
    width: 300px;
    height: 300px;
  }

  #scan-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: rgb(76, 60, 60);
    animation: scan 2s linear infinite;
  }

  @keyframes scan {
    0%   { top: 0; }
    50%  { top: 250px; }
    100% { top: 0; }
  }
</style></head>
<body>

  <h1>Peace</h1>
  <p>How peaceful are you feeling right now?</p>

  <div id="scan-box">
  <video id="video" autoplay playsinline muted width="300" height="300"></video>
  <div id="scan-line"></div>
</div>

  <p id="status">Hold your card up to the camera</p>
  <p id="scanned" style="display:none">You chose: <strong id="val"></strong></p>

  <div id="buttons">
    <a href="#" onclick="confirm(0)">0</a>
    <a href="#" onclick="confirm(1)">1</a>
    <a href="#" onclick="confirm(2)">2</a>
    <a href="#" onclick="confirm(3)">3</a>
    <a href="#" onclick="confirm(4)">4</a>
    <a href="#" onclick="confirm(5)">5</a>
    <a href="#" onclick="confirm(6)">6</a>
    <a href="#" onclick="confirm(7)">7</a>
    <a href="#" onclick="confirm(8)">8</a>
    <a href="#" onclick="confirm(9)">9</a>
    <a href="#" onclick="confirm(10)">10</a>
  </div>

  <script>
    const EMOTION_KEY = 'peace';
    const NEXT_PAGE = 'love.html';
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
  <script src="scanner.js"></script>

</body>
</html>
